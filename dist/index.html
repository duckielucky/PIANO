<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Upload a song and VIPERMIX turns its beats into a rhythm game. Tap blue notes and hold purple notes. Play in English or Chinese.">
  <title>VIPERMIX — Find your rhythm</title>
  <link rel="icon" href="vipermix-icon.png?v=83b93f0585" type="image/png">
  <link rel="stylesheet" href="style.css?v=379e116f4a">
  <link rel="stylesheet" href="landscape.css?v=412d5b5f65">
  <link rel="stylesheet" href="theme.css?v=1bccc4c1f7">
</head>
<body data-state="menu">
  <main class="phone" id="game" data-i18n-aria="game" aria-label="VIPERMIX rhythm game">
    <header class="game-header"><a class="wordmark" href="./" data-i18n-aria="home" aria-label="VIPERMIX home"><img class="brand-logo" src="vipermix-logo.webp?v=496b53aff8" alt="VIPERMIX"><span class="brand-name">VIPER<span>MIX</span></span></a><div class="header-actions"><button class="language-button" data-language-toggle aria-label="切换到中文" lang="zh-CN">中文</button><button class="icon-button" id="fullscreenButton" data-i18n-aria="fullscreen" aria-label="Toggle fullscreen" data-i18n-title="fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button class="icon-button" id="soundButton" aria-label="Mute sound" title="Mute sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><button class="icon-button" id="pauseButton" data-i18n-aria="pause" aria-label="Pause game" data-i18n-title="pause" title="Pause (Esc)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div></header>
    <section class="scoreboard" data-i18n-aria="liveScore" aria-label="Live score"><div><span class="label" data-i18n="score">SCORE</span><strong id="score">0000000</strong></div><div class="best-score"><span class="label"><span data-i18n="best">PERSONAL BEST</span> <span>↗</span></span><strong id="best">0000000</strong></div></section>
    <div class="energy"><div id="energyFill"></div><span id="energyLabel">NO FAIL</span><b id="energyText">100%</b></div>
    <section class="stage" id="stage" data-i18n-aria="stage" aria-label="Four note lanes. Tap when notes reach the glowing line.">
      <canvas id="canvas" data-i18n-aria="canvas" aria-label="Notes travel down four lanes. Use D, F, J, K, or touch the lanes." role="img"></canvas>
      <div class="stage-meta"><span><i></i> <span id="difficultyLabel">CHILL</span></span><span id="bpmLabel">110 BPM</span></div>
      <div class="combo" id="comboBox"><strong id="combo">0</strong><span data-i18n="combo">COMBO</span></div>
      <div id="judgment" class="judgment" aria-live="off"></div>
      <div class="lane-inputs" id="laneInputs"><button aria-label="Lane 1, D key" data-lane="0"><span>D</span></button><button aria-label="Lane 2, F key" data-lane="1"><span>F</span></button><button aria-label="Lane 3, J key" data-lane="2"><span>J</span></button><button aria-label="Lane 4, K key" data-lane="3"><span>K</span></button></div>
      <div class="countdown" id="countdown" hidden></div>
    </section>
      <div class="menu-overlay" id="menu">
        <div class="ready-chip"><span></span> <span data-i18n="mainMenu">MAIN MENU</span></div>
        <h2 class="menu-title"><span data-i18n="tapHold">TAP. HOLD.</span><em data-i18n="flow">FLOW.</em></h2>
        <button class="primary-button" id="playButton"><span aria-hidden="true">▶</span><span data-i18n="play">PLAY</span><span class="button-arrow" aria-hidden="true">↗</span></button>
        <p class="menu-caption" data-i18n="menuHint">Choose a song. Find your rhythm.</p>
        <button class="text-button" id="helpButton"><span class="button-label" data-i18n="help">HELP</span> <span>?</span></button>
      </div>
    <footer class="track-footer"><button class="track-art" id="trackButton" data-i18n-aria="changeTrack" aria-label="Change track"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 30 17 7 25 29 34 12 43 30 32 39 16 38Z"/><path d="m5 30 20-1 7 10M17 7l-1 31m18-26-9 17 18 1"/></svg></button><div class="track-info"><strong id="trackName">Afterglow</strong><span id="trackDetail">110 BPM · 00:52</span></div><button class="next-track icon-button" id="nextTrack" data-i18n-aria="nextTrack" aria-label="Select next track" data-i18n-title="nextTrack" title="Next track">⌃<span>⌄</span></button><div class="playing-bars" id="playingBars" hidden><i></i><i></i><i></i><i></i></div></footer><div class="song-progress"><div id="songProgress"></div></div>
    <input type="file" id="songFile" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.aiff,.webm" multiple hidden>
    <dialog id="modal"><div id="modalContent"></div></dialog>
  </main>
  <section class="start-screen" id="startScreen" aria-labelledby="startTitle">
    <button class="language-button start-language" data-language-toggle aria-label="切换到中文" lang="zh-CN">中文</button>
    <div class="start-body">
      <img class="start-logo" src="vipermix-logo.webp?v=496b53aff8" alt="">
      <h1 class="start-title" id="startTitle">VIPER<span>MIX</span></h1>
      <p class="start-tag"><span data-i18n="tapHold">TAP. HOLD.</span> <em data-i18n="flow">FLOW.</em></p>
      <button class="primary-button start-play" id="startButton"><span aria-hidden="true">▶</span><span data-i18n="play">PLAY</span></button>
    </div>
  </section>
  <section class="orientation-hint" id="orientationHint" hidden data-i18n-aria="landscape" aria-label="Landscape play">
    <button class="language-button orientation-language" data-language-toggle aria-label="切换到中文" lang="zh-CN">中文</button>
    <svg class="rotate-phone" viewBox="0 0 120 100" aria-hidden="true"><rect x="38" y="19" width="44" height="68" rx="9"/><path d="M55 77h10M28 38C28 19 42 7 60 7c19 0 34 12 34 31M85 29l9 9 8-9"/></svg>
    <h2><span data-i18n="turn">TURN</span><br><em data-i18n="sideways">SIDEWAYS.</em></h2>
    <button class="text-button" id="portraitButton" data-i18n="portrait">PLAY HERE ANYWAY</button>
  </section>
  <script type="module" src="game.js?v=6eff41104d"></script>
</body>
</html>
